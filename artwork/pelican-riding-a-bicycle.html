  .meta { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .frame { padding: 10px 18px 6px; }
  svg { display:block; width: 100%; height: auto; border-radius: 12px; border: 1px solid rgba(36,23,38,.15); }
  footer { padding: 10px 28px 20px; font-size: 12px; color: var(--muted); display:flex; justify-content: space-between; gap:12px; flex-wrap: wrap; }
