name: Render stills

# Build-loop helper: render a handful of frames from one composition so a set can be checked before
# committing to a full 232 s render. Uploads the PNGs as an artifact (no video, no mux).

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: true
        default: "PigWarShort"
      frames:
        description: "Comma-separated frame numbers"
        required: true
        default: "30"
      scale:
        description: "Render scale (0.5 = 540x960, fastest)"
        required: false
        default: "0.5"

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json

      - name: Install Playwright Chromium (SwiftShader WebGL)
        run: npx playwright@1.49.1 install --with-deps chromium
        working-directory: remotion-app

      - name: Resolve Playwright Chromium path
        run: |
          CHROME="$(find ~/.cache/ms-playwright -maxdepth 4 -type f -name chrome -o -name headless_shell | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          ls -lh "$CHROME" || true

      - name: Install
        working-directory: remotion-app
        run: npm ci

      - name: Typecheck
        working-directory: remotion-app
        run: npx tsc --noEmit

      - name: Stills
        working-directory: remotion-app
        run: |
          mkdir -p out/stills
          npx remotion browser ensure
          IFS=',' read -ra FS <<< "${{ inputs.frames }}"
          for FR in "${FS[@]}"; do
            FR="$(echo "$FR" | tr -d ' ')"
            echo "--- frame $FR"
            npx remotion still src/index.ts "${{ inputs.composition }}" \
              "out/stills/f$(printf '%05d' "$FR").png" --frame="$FR" --scale="${{ inputs.scale }}" \
              --timeout=300000 --concurrency=1 --gl=swiftshader --browser-executable="$CHROME_PATH"
          done

      - name: Upload stills
        uses: actions/upload-artifact@v4
        with:
          name: stills
          path: remotion-app/out/stills
          if-no-files-found: error
          retention-days: 14
