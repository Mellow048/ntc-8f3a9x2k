name: Publish artifact to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id whose cartoon-3d-short artifact to publish"
        required: true
      tag:
        description: "Release tag (created on the working branch if missing)"
        required: true
        default: "darkday-v1"
      asset_name:
        description: "Filename for the MP4 asset in the release"
        required: true
        default: "DarkDay-1780-720p.mp4"
      title:
        description: "Release title"
        required: true
        default: "The Dark Day (1780) — 720p short"
      notes:
        description: "Release notes / delivery summary"
        required: true
        default: "Burned-in English captions (user order). Voice-09. -15 LUFS / -1.2 dBTP (see shoots/darkday/DELIVERY.md)."

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (sanity check)
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Download artifact from the render run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifact && mkdir artifact
          gh run download ${{ inputs.run_id }} --repo "${{ github.repository }}" --name cartoon-3d-short --dir artifact
          ls -laR artifact
          test -f artifact/final.mp4
          BYTES=$(stat -c%s artifact/final.mp4)
          echo "final.mp4: ${BYTES} bytes"
          [ "$BYTES" -gt 10000000 ] || (echo "artifact suspiciously small" && exit 1)
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of default=noprint_wrappers=1 artifact/final.mp4

      - name: Create release (if missing) and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" \
              --target arena/5a7dfc84-ntc-8f3a9x2k --title "${{ inputs.title }}" --notes "${{ inputs.notes }}"
          fi
          cp artifact/final.mp4 "${{ inputs.asset_name }}"
          gh release upload "${{ inputs.tag }}" "${{ inputs.asset_name }}" --repo "${{ github.repository }}" --clobber
          if [ -f artifact/still.png ]; then
            cp artifact/still.png "still-${{ inputs.tag }}.png"
            gh release upload "${{ inputs.tag }}" "still-${{ inputs.tag }}.png" --repo "${{ github.repository }}" --clobber
          fi
          echo "DIRECT_LINK=https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ inputs.asset_name }}"
