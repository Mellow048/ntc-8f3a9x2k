name: Yamaguchi — remembrance river repair
on:
  push:
    branches: [arena/044538ca-ntc-8f3a9x2k]
    paths: ['.github/workflows/survivor-river-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: survivor-remaster-${{ github.ref }}
  cancel-in-progress: false
jobs:
  survivor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and preflight
        run: |
          cd remotion-app
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx playwright@1.49.1 install --with-deps chromium
          CHROME="$(find ~/.cache/ms-playwright -type f -name chrome | head -1)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          cd ..
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy pillow scipy
          ffmpeg -version
          ffprobe -version
          mkdir -p shoots/curiosity-survivor/out/remaster
          python scripts/survivor-remaster/score.py
          ffmpeg -y -i shoots/curiosity-survivor/out/remaster/audio/premix.wav -af loudnorm=I=-15:TP=-1.5:LRA=5 -ar 48000 shoots/curiosity-survivor/out/remaster/mix.wav
      - name: Render corrected remembrance shots only
        working-directory: remotion-app
        run: |
          npx remotion render src/survivor-remaster/index.tsx SurvivorRemastered ../shoots/curiosity-survivor/out/remaster/river-a.mp4 --frames=1055-1126 --width=720 --height=1280 --codec=h264 --crf=18 --concurrency=2 --gl=swiftshader --browser-executable="$CHROME_PATH" --timeout=300000
          npx remotion render src/survivor-remaster/index.tsx SurvivorRemastered ../shoots/curiosity-survivor/out/remaster/river-b.mp4 --frames=1169-1260 --width=720 --height=1280 --codec=h264 --crf=18 --concurrency=2 --gl=swiftshader --browser-executable="$CHROME_PATH" --timeout=300000
      - name: Replace exact frame ranges and verify
        run: |
          ffmpeg -y -i deliveries/survivor-remastered/survivor-remastered-720p.mp4 -i shoots/curiosity-survivor/out/remaster/river-a.mp4 -i shoots/curiosity-survivor/out/remaster/river-b.mp4 -filter_complex "[0:v]trim=end_frame=1055,setpts=PTS-STARTPTS[a];[1:v]setpts=PTS-STARTPTS[b];[0:v]trim=start_frame=1127:end_frame=1169,setpts=PTS-STARTPTS[c];[2:v]setpts=PTS-STARTPTS[d];[a][b][c][d]concat=n=4:v=1:a=0[v]" -map "[v]" -map 0:a:0 -c:v libx264 -preset slow -crf 20 -r 30 -c:a copy -movflags +faststart shoots/curiosity-survivor/out/remaster/repaired.mp4
          mv shoots/curiosity-survivor/out/remaster/repaired.mp4 deliveries/survivor-remastered/survivor-remastered-720p.mp4
          python scripts/survivor-remaster/qa.py
          bash scripts/curiosity/publish.sh "Deliver corrected river remembrance shots" deliveries/survivor-remastered
