name: Lake audio and ending polish — no 3D render
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lake-polish
  cancel-in-progress: false
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install numpy scipy
      - name: Compose new audible score
        run: |
          python scripts/lake-polish/score.py
          ffmpeg -y -i shoots/curiosity-lake/out/polish/audio/premix.wav -af loudnorm=I=-14:TP=-1.5:LRA=5 -ar 48000 shoots/curiosity-lake/out/polish/mix.wav
      - name: Retime existing picture to match the ending pause
        run: |
          mkdir -p shoots/curiosity-lake/out/polish deliveries/lake-polished
          # Retiming matches the narrator's pause. Subtitles are already in the
          # picture, so moving picture + voice together preserves their sync.
          ffmpeg -y -i deliveries/lake-remastered/lake-remastered-720p.mp4 -filter_complex "[0:v]split[a][b];[a]trim=end_frame=1081,setpts=PTS-STARTPTS,tpad=stop_mode=clone:stop_duration=0.5[v1];[b]trim=start_frame=1081,setpts=PTS-STARTPTS,tpad=stop_mode=clone:stop_duration=1[v2];[v1][v2]concat=n=2:v=1:a=0[v]" -map '[v]' -an -c:v libx264 -preset fast -crf 15 -r 30 shoots/curiosity-lake/out/polish/picture.mp4
          ffmpeg -y -i shoots/curiosity-lake/out/polish/picture.mp4 -i shoots/curiosity-lake/out/polish/mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k -t 38.4 -movflags +faststart deliveries/lake-polished/lake-polished-720p.mp4
          cp shoots/curiosity-lake/out/polish/audio/music-report.md deliveries/lake-polished/music-report.md
      - name: Verify export and loudness
        run: |
          ffprobe -v error -show_streams -show_format -of json deliveries/lake-polished/lake-polished-720p.mp4 > deliveries/lake-polished/probe.json
          ffmpeg -i deliveries/lake-polished/lake-polished-720p.mp4 -af loudnorm=I=-14:TP=-1.5:LRA=5:print_format=json -f null - 2> deliveries/lake-polished/loudness.txt
          python - <<'PY'
          import json
          p=json.load(open('deliveries/lake-polished/probe.json'))
          v=next(s for s in p['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'],v['r_frame_rate'])==(720,1280,'30/1')
          assert abs(float(p['format']['duration'])-38.4)<.1
          PY
      - name: Publish revised MP4
        run: bash scripts/curiosity/publish.sh "Deliver Lake audible score and paced ending" deliveries/lake-polished
