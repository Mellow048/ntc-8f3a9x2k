name: Pendulum frame diagnostics
on:
  workflow_dispatch:
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json
      - name: Install browser
        working-directory: remotion-app
        run: |
          npx playwright@1.49.1 install --with-deps chromium
          CHROME="$(find ~/.cache/ms-playwright -maxdepth 4 -type f \( -name chrome -o -name headless_shell \) | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Install
        working-directory: remotion-app
        run: npm ci
      - name: Render 720p key frames
        working-directory: remotion-app
        run: |
          mkdir -p out/diagnostics
          for frame in 80 220 340 475 610 805 1025 1200 1370 1460 1515 1625 1725 1875; do
            echo "Rendering frame $frame"
            npx remotion still src/index.ts PendulumShort "out/diagnostics/$frame.png" --frame="$frame" --width=720 --height=1280 --gl=swiftshader --timeout=300000 --browser-executable="$CHROME_PATH" >"out/diagnostics/$frame.log" 2>&1 || { msg=$(tail -n 12 "out/diagnostics/$frame.log" | tr '\n' ' '); echo "::error::Frame $frame failed: $msg"; exit 1; }
            ffmpeg -v error -y -i "out/diagnostics/$frame.png" -vf scale=270:480 -q:v 10 "out/diagnostics/$frame.jpg"
            # Compact diagnostic thumbnails are retrievable from the check-run API.
            echo "::notice title=frame-$frame::$(base64 -w0 "out/diagnostics/$frame.jpg")"
          done
      - name: Upload stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pendulum-keyframes-720p
          path: remotion-app/out/diagnostics/
          retention-days: 7
