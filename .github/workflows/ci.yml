name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify preserved reference checksums
        run: |
          python3 references/approved/verify.py
          python3 references/news/verify.py

      - name: Check standalone approved Köpenick source
        run: |
          npm ci --prefix references/approved/koepenick/source/remotion-app
          npm run typecheck --prefix references/approved/koepenick/source/remotion-app
          cd references/approved/koepenick/source
          node scripts/koepenick/test.mjs
          python3 -m py_compile shoots/koepenick/audio/*.py shoots/koepenick/voice/prepare.py scripts/koepenick/*.py

      - name: Check standalone approved news sources
        run: |
          for film in nvidia-spy gta6-leaker fridge-hack binance-heist fake-boss; do
            npm ci --no-audit --no-fund --prefix "references/news/$film/source/remotion-app"
            npm run typecheck --prefix "references/news/$film/source/remotion-app"
            node --check "references/news/$film/source/remotion-app/scripts/plan.mjs"
            node --check "references/news/$film/source/remotion-app/scripts/stills.mjs"
            node --check "references/news/$film/source/remotion-app/scripts/frame.mjs"
          done
          python3 -m py_compile references/news/*/source/shoots/*/audio/build_mix.py \
            references/news/*/source/shoots/*/build_voice.py references/news/*/source/shoots/voice_master.py

      - name: Check the live app, the news tools, and that every news film can be put back in a checkout
        run: |
          # Job logs cannot be downloaded from every agent sandbox, annotations can
          # (gh api repos/<owner>/<repo>/check-runs/<job id>/annotations): say which command failed, and its last lines.
          try() {
            if ! "$@" > /tmp/try.log 2>&1; then
              cat /tmp/try.log
              echo "::error title=CI command failed::$* %0A$(tail -n 25 /tmp/try.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              exit 1
            fi
            cat /tmp/try.log
          }
          try npm ci --no-audit --no-fund --prefix remotion-app
          try npm run typecheck --prefix remotion-app
          for f in remotion-app/scripts/*.mjs; do try node --check "$f"; done
          for f in remotion-app/scripts/*.sh; do try bash -n "$f"; done
          try python3 -m py_compile references/news/*.py
          for film in nvidia-spy gta6-leaker fridge-hack binance-heist fake-boss; do
            try python3 references/news/restore.py "$film"
          done
          try npm run typecheck --prefix remotion-app

      - name: Check audio/QA Python scripts compile
        run: |
          python3 -m py_compile templates/audio/*.py templates/scripts/*.py

      - name: Check helper scripts parse
        run: |
          node --check templates/scripts/bridge-stills.mjs
          node --check templates/scripts/bridge_shots.py 2>/dev/null || true

      - name: Verify skill + templates present
        run: |
          test -f SKILL.md
          test -f templates/bridge/Bridge.tsx
          test -f templates/bridge/story.ts
          test -f templates/bridge/toon.ts
          test -f references/STYLE_BIBLE.md
          echo "skill tree ok"
