name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: false
        default: "SupermarketShort"
      mix:
        description: "Voice/mix WAV path in repo"
        required: false
        default: "shoots/supermarket/audio/mix.wav"
      crf:
        description: "x264 CRF (lower is better)"
        required: false
        default: "16"
      size:
        description: "Final size: 720 (720x1280, fastest) or 1080 or 2K (slow on CI CPU)"
        required: false
        default: "720"
      still_frame:
        description: "Frame number for the still preview (Petit: 'all' for 26-shot preview, '-1' for full render)"
        required: false
        default: "100"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REMOTION_TMP: ${{ github.workspace }}/.remotion-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json

      - name: Install Playwright Chromium (SwiftShader WebGL)
        run: npx playwright@1.49.1 install --with-deps chromium
        working-directory: remotion-app

      - name: Resolve Playwright Chromium path
        run: |
          CHROME="$(find ~/.cache/ms-playwright -maxdepth 4 -type f -name chrome -o -name headless_shell | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          ls -lh "$CHROME" || true

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install (Remotion scaffold)
        working-directory: remotion-app
        run: npm ci

      - name: Typecheck
        working-directory: remotion-app
        run: npx tsc --noEmit

      - name: Petit timing tests
        if: inputs.composition == 'Petit'
        run: node scripts/petit/test.mjs

      - name: Petit 26-shot preview stills
        if: inputs.composition == 'Petit' && inputs.still_frame == 'all'
        run: |
          npx remotion browser ensure
          CHROME_PATH="$CHROME_PATH" node scripts/petit/stills.mjs
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}

      - name: Commit Petit previews
        if: inputs.composition == 'Petit' && inputs.still_frame == 'all'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shoots/petit/out/previews/
          git commit -m "Petit: 26-shot preview stills" || echo "no previews to commit"
          git push || echo "push failed (check branch)"

      - name: Still preview
        if: inputs.composition != 'Petit' || (inputs.still_frame != 'all' && inputs.still_frame != '-1')
        working-directory: remotion-app
        run: |
          npx remotion browser ensure
          npx remotion still src/index.ts "${{ github.event.inputs.composition }}" \
            out/still.png --frame="${{ github.event.inputs.still_frame }}" --scale=1 --timeout=300000 --concurrency=2 --gl=swiftshader --browser-executable="$CHROME_PATH" --log=verbose

      - name: Render video
        if: inputs.composition != 'Petit' || inputs.still_frame == '-1'
        working-directory: remotion-app
        run: |
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" \
            out/final.mp4 --codec h264 --crf "${{ github.event.inputs.crf }}" ${{ github.event.inputs.size == '2K' && '--width=1440 --height=2560' || github.event.inputs.size == '1080' && '--scale=1' || '--width=720 --height=1280' }} --gl=swiftshader --timeout=300000 --concurrency=2 --browser-executable="$CHROME_PATH"

      - name: Mux voice mix
        if: (inputs.composition != 'Petit' || inputs.still_frame == '-1') && inputs.mix != ''
        run: |
          ffmpeg -y -i remotion-app/out/final.mp4 -i "${{ github.event.inputs.mix }}" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -shortest remotion-app/out/final-muxed.mp4
          mv remotion-app/out/final-muxed.mp4 remotion-app/out/final.mp4

      - name: Upload MP4
        if: inputs.composition != 'Petit' || inputs.still_frame == '-1'
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-3d-short
          path: |
            remotion-app/out/final.mp4
            remotion-app/out/still.png
          if-no-files-found: error
          retention-days: 14
