name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: false
        default: "SupermarketShort"
      mix:
        description: "Voice/mix WAV path in repo"
        required: false
        default: "shoots/supermarket/audio/mix.wav"
      crf:
        description: "x264 CRF (lower is better)"
        required: false
        default: "16"
      size:
        description: "Final size: 720 (720x1280, fastest) or 1080 or 2K (slow on CI CPU)"
        required: false
        default: "720"
      still_frame:
        description: "Frame number for the still preview"
        required: false
        default: "100"
      diagnostics:
        description: "Render only keyframe diagnostics (true/false)"
        required: false
        default: "false"
      qa:
        description: "Optional JSON shot metadata for final quality checks"
        required: false
        default: ""
      deliver_series:
        description: "Publish the five completed series renders to the session branch"
        required: false
        default: "false"

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  render:
    if: inputs.deliver_series != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REMOTION_TMP: ${{ github.workspace }}/.remotion-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json

      - name: Install Playwright Chromium (SwiftShader WebGL)
        run: npx playwright@1.49.1 install --with-deps chromium
        working-directory: remotion-app

      - name: Resolve Playwright Chromium path
        run: |
          CHROME="$(find ~/.cache/ms-playwright -maxdepth 4 -type f -name chrome -o -name headless_shell | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          ls -lh "$CHROME" || true

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install (Remotion scaffold)
        working-directory: remotion-app
        run: npm ci

      - name: Typecheck
        working-directory: remotion-app
        run: npx tsc --noEmit

      - name: Keyframe diagnostics
        if: inputs.diagnostics == 'true'
        working-directory: remotion-app
        run: |
          mkdir -p out/diagnostics
          for frame in 100 400 900 1500; do
            npx remotion still src/index.ts "${{ inputs.composition }}" "out/diagnostics/$frame.png" --frame="$frame" --width=720 --height=1280 --gl=swiftshader --timeout=300000 --browser-executable="$CHROME_PATH"
          done
      - name: Upload diagnostic stills
        if: inputs.diagnostics == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: keyframes-720p
          path: remotion-app/out/diagnostics/
          retention-days: 7

      - name: Still preview
        if: inputs.diagnostics != 'true'
        working-directory: remotion-app
        run: |
          npx remotion browser ensure
          npx remotion still src/index.ts "${{ github.event.inputs.composition }}" \
            out/still.png --frame="${{ github.event.inputs.still_frame }}" ${{ github.event.inputs.size == '2K' && '--width=1440 --height=2560' || github.event.inputs.size == '1080' && '--scale=1' || '--width=720 --height=1280' }} --timeout=300000 --concurrency=2 --gl=swiftshader --browser-executable="$CHROME_PATH" --log=verbose

      - name: Render video
        if: inputs.diagnostics != 'true'
        working-directory: remotion-app
        run: |
          set -o pipefail
          set +e
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" \
            out/final.mp4 --codec h264 --crf "${{ github.event.inputs.crf }}" ${{ github.event.inputs.size == '2K' && '--width=1440 --height=2560' || github.event.inputs.size == '1080' && '--scale=1' || '--width=720 --height=1280' }} --gl=swiftshader --timeout=300000 --concurrency=2 --browser-executable="$CHROME_PATH" 2>&1 | tee out/render.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the actual failure in the check annotation, even if job logs are unavailable.
            message=$(tail -c 12000 out/render.log | tr '\r' '\n' | tail -n 30)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            echo "::error::Render failed (exit $status): $message"
          fi
          exit "$status"

      - name: Mux voice mix
        if: inputs.diagnostics != 'true' && inputs.mix != ''
        run: |
          ffmpeg -y -i remotion-app/out/final.mp4 -i "${{ github.event.inputs.mix }}" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -shortest remotion-app/out/final-muxed.mp4
          mv remotion-app/out/final-muxed.mp4 remotion-app/out/final.mp4

      - name: Quality check (Pendulum)
        if: inputs.diagnostics != 'true' && inputs.composition == 'PendulumShort' && inputs.mix != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/short-qa-venv"
          "$RUNNER_TEMP/short-qa-venv/bin/pip" install numpy pillow
          "$RUNNER_TEMP/short-qa-venv/bin/python" templates/scripts/short_qa.py remotion-app/out/final.mp4 remotion-app/out/qa shoots/pendulum/qa-shots.json
          "$RUNNER_TEMP/short-qa-venv/bin/python" - <<'PYQA'
          from pathlib import Path
          import re
          report = Path('remotion-app/out/qa/report.md').read_text()
          print('::notice::' + report.replace('%', '%25').replace('\n', '%0A'))
          ok = ('720x1280 30/1 fps, 1965 frames, 65.500 s' in report
                and 'black []' in report and 'unplanned white []' in report
                and 'frozen spans >=12f []' in report)
          loud = re.search(r'I:\s*(-?\d+(?:\.\d+)?) LUFS', report)
          peak = re.search(r'Peak:\s*(-?\d+(?:\.\d+)?) dBFS', report)
          ok = ok and loud is not None and -17 <= float(loud.group(1)) <= -13
          ok = ok and peak is not None and float(peak.group(1)) <= -1.0
          if not ok:
              raise SystemExit('QA failed: review report.md in the artifact')
          PYQA

      - name: Quality check (engineering series)
        if: inputs.diagnostics != 'true' && inputs.qa != '' && inputs.mix != ''
        env:
          QA_META: ${{ inputs.qa }}
        run: |
          python3 -m venv "$RUNNER_TEMP/short-qa-venv"
          "$RUNNER_TEMP/short-qa-venv/bin/pip" install numpy pillow
          "$RUNNER_TEMP/short-qa-venv/bin/python" templates/scripts/short_qa.py remotion-app/out/final.mp4 remotion-app/out/qa "$QA_META"
          "$RUNNER_TEMP/short-qa-venv/bin/python" - <<'PYQA'
          from pathlib import Path
          import json, os, re
          report = Path('remotion-app/out/qa/report.md').read_text()
          frames = json.loads(Path(os.environ['QA_META']).read_text())['frames']
          print('::notice::' + report.replace('%', '%25').replace('\n', '%0A'))
          ok = (f'720x1280 30/1 fps, {frames} frames' in report and 'black []' in report
                and 'unplanned white []' in report and 'frozen spans >=12f []' in report)
          loud = re.search(r'I:\s*(-?\d+(?:\.\d+)?) LUFS', report)
          peak = re.search(r'Peak:\s*(-?\d+(?:\.\d+)?) dBFS', report)
          ok = ok and loud is not None and -17 <= float(loud.group(1)) <= -13
          ok = ok and peak is not None and float(peak.group(1)) <= -1.0
          if not ok:
              raise SystemExit('QA failed: review report.md in the artifact')
          PYQA

      - name: Upload MP4
        if: inputs.diagnostics != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-3d-short
          path: |
            remotion-app/out/final.mp4
            remotion-app/out/still.png
            remotion-app/out/qa/report.md
          if-no-files-found: error
          retention-days: 14

  deliver-series:
    if: inputs.deliver_series == 'true' && github.ref == 'refs/heads/arena/2524fc8a-ntc-8f3a9x2k'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait for all five renders and QA checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 42744027645 42744030949 42744034510 42744038290 42744041209; do
            gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60
          done
      - uses: actions/checkout@v4
        with:
          ref: arena/2524fc8a-ntc-8f3a9x2k
      - uses: actions/download-artifact@v4
        with:
          name: cartoon-3d-short
          run-id: 42744027645
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: delivery/breathing-bridge
      - uses: actions/download-artifact@v4
        with:
          name: cartoon-3d-short
          run-id: 42744030949
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: delivery/spring-building
      - uses: actions/download-artifact@v4
        with:
          name: cartoon-3d-short
          run-id: 42744034510
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: delivery/ocean-airport
      - uses: actions/download-artifact@v4
        with:
          name: cartoon-3d-short
          run-id: 42744038290
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: delivery/channel-tunnel
      - uses: actions/download-artifact@v4
        with:
          name: cartoon-3d-short
          run-id: 42744041209
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: delivery/sky-plaza
      - name: Recheck videos with caption-aware metadata
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/delivery-qa"
          "$RUNNER_TEMP/delivery-qa/bin/pip" install numpy pillow
          for slug in breathing-bridge spring-building ocean-airport channel-tunnel sky-plaza; do
            "$RUNNER_TEMP/delivery-qa/bin/python" templates/scripts/short_qa.py "delivery/$slug/final.mp4" "$RUNNER_TEMP/qa-$slug" "shoots/$slug/qa-shots.json"
            cp "$RUNNER_TEMP/qa-$slug/report.md" "shoots/$slug/qa-report.md"
          done
      - name: Commit videos and QA reports to the branch
        run: |
          set -euo pipefail
          for slug in breathing-bridge spring-building ocean-airport channel-tunnel sky-plaza; do
            test -s "delivery/$slug/final.mp4"
            test -s "shoots/$slug/qa-report.md"
            test "$(stat -c %s "delivery/$slug/final.mp4")" -lt 100000000
            cp "delivery/$slug/final.mp4" "shoots/$slug/final-720p.mp4"
            git add -f "shoots/$slug/final-720p.mp4" "shoots/$slug/qa-report.md"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add five finished 720p engineering shorts'
          git push origin HEAD:arena/2524fc8a-ntc-8f3a9x2k
