name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: false
        default: "SupermarketShort"
      mix:
        description: "Voice/mix WAV path in repo"
        required: false
        default: "shoots/supermarket/audio/mix.wav"
      crf:
        description: "x264 CRF (lower is better)"
        required: false
        default: "16"
      size:
        description: "Final size: 1080 (fast trust render) or 2K (1440x2560, slow on CI CPU)"
        required: false
        default: "1080"
      still_frame:
        description: "Frame number for the still preview"
        required: false
        default: "100"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REMOTION_TMP: ${{ github.workspace }}/.remotion-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json

      - name: Install Playwright Chromium (SwiftShader WebGL)
        run: npx playwright@1.49.1 install --with-deps chromium
        working-directory: remotion-app

      - name: Resolve Playwright Chromium path
        run: |
          CHROME="$(find ~/.cache/ms-playwright -maxdepth 4 -type f -name chrome -o -name headless_shell | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          ls -lh "$CHROME" || true

      - name: Install (Remotion scaffold)
        working-directory: remotion-app
        run: npm ci

      - name: Typecheck
        working-directory: remotion-app
        run: npx tsc --noEmit

      - name: Still preview
        working-directory: remotion-app
        run: |
          npx remotion browser ensure
          npx remotion still src/index.ts "${{ github.event.inputs.composition }}" \
            out/still.png --frame="${{ github.event.inputs.still_frame }}" --scale=1 --timeout=300000 --concurrency=2 --gl=swiftshader --browser-executable="$CHROME_PATH" --log=verbose

      - name: Render 2K
        working-directory: remotion-app
        run: |
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" \
            out/final.mp4 --codec h264 --crf "${{ github.event.inputs.crf }}" ${{ github.event.inputs.size == '2K' && '--width=1440 --height=2560' || '--scale=1' }} --gl=swiftshader --timeout=300000 --concurrency=2 --browser-executable="$CHROME_PATH"

      - name: Mux voice mix
        if: inputs.mix != ''
        run: |
          ffmpeg -y -i remotion-app/out/final.mp4 -i "${{ github.event.inputs.mix }}" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -shortest remotion-app/out/final-muxed.mp4
          mv remotion-app/out/final-muxed.mp4 remotion-app/out/final.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-3d-short
          path: |
            remotion-app/out/final.mp4
            remotion-app/out/still.png
          if-no-files-found: error
          retention-days: 14
