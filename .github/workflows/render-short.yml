name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: false
        default: "SupermarketShort"
      mix:
        description: "Voice/mix WAV path in repo"
        required: false
        default: "shoots/supermarket/audio/mix.wav"
      crf:
        description: "x264 CRF (lower is better)"
        required: false
        default: "16"
      still_frame:
        description: "Frame number for the still preview"
        required: false
        default: "100"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REMOTION_TMP: ${{ github.workspace }}/.remotion-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json

      - name: Install browser system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libgbm1 libnss3 libasound2t64 libatk1.0-0t64 \
            xvfb mesa-utils libgl1-mesa-dri libegl-mesa0 libgbm1 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 \
            libcairo2 libatspi2.0-0t64 fonts-liberation

      - name: Install (Remotion scaffold)
        working-directory: remotion-app
        run: npm ci

      - name: Typecheck
        working-directory: remotion-app
        run: npx tsc --noEmit

      - name: Still preview
        working-directory: remotion-app
        run: |
          npx remotion browser ensure
          xvfb-run -a -s "-screen 0 1920x1080x24" npx remotion still src/index.ts "${{ github.event.inputs.composition }}" \
            out/still.png --frame="${{ github.event.inputs.still_frame }}" --scale=1 --gl=egl --disable-headless --log=verbose

      - name: Render 2K
        working-directory: remotion-app
        run: |
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" \
            out/final.mp4 --codec h264 --crf "${{ github.event.inputs.crf }}" --scale 1.3333 --gl=egl --disable-headless

      - name: Mux voice mix
        if: inputs.mix != ''
        run: |
          ffmpeg -y -i remotion-app/out/final.mp4 -i "${{ github.event.inputs.mix }}" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -shortest remotion-app/out/final-muxed.mp4
          mv remotion-app/out/final-muxed.mp4 remotion-app/out/final.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-3d-short
          path: |
            remotion-app/out/final.mp4
            remotion-app/out/still.png
          if-no-files-found: error
          retention-days: 14
