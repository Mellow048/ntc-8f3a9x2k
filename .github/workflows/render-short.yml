name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: false
        default: "SupermarketShort"
      mix:
        description: "Voice/mix WAV path in repo"
        required: false
        default: "shoots/supermarket/audio/mix.wav"
      crf:
        description: "x264 CRF (lower is better)"
        required: false
        default: "16"
      size:
        description: "Final size: 720 (720x1280, fastest) or 1080 or 2K (slow on CI CPU)"
        required: false
        default: "720"
      still_frame:
        description: "Frame number for the still preview"
        required: false
        default: "100"
      diagnostics:
        description: "Render only pendulum keyframe diagnostics (true/false)"
        required: false
        default: "false"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REMOTION_TMP: ${{ github.workspace }}/.remotion-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json

      - name: Install Playwright Chromium (SwiftShader WebGL)
        run: npx playwright@1.49.1 install --with-deps chromium
        working-directory: remotion-app

      - name: Resolve Playwright Chromium path
        run: |
          CHROME="$(find ~/.cache/ms-playwright -maxdepth 4 -type f -name chrome -o -name headless_shell | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          ls -lh "$CHROME" || true

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install (Remotion scaffold)
        working-directory: remotion-app
        run: npm ci

      - name: Typecheck
        working-directory: remotion-app
        run: npx tsc --noEmit

      - name: Pendulum keyframe diagnostics
        if: inputs.diagnostics == 'true'
        working-directory: remotion-app
        run: |
          mkdir -p out/diagnostics
          for frame in 80 610 805 1875; do
            echo "Rendering frame $frame"
            npx remotion still src/index.ts PendulumShort "out/diagnostics/$frame.png" --frame="$frame" --width=720 --height=1280 --gl=swiftshader --timeout=300000 --browser-executable="$CHROME_PATH" >"out/diagnostics/$frame.log" 2>&1 || { msg=$(tail -n 12 "out/diagnostics/$frame.log" | tr '\n' ' '); echo "::error::Frame $frame failed: $msg"; exit 1; }
            echo "file '$frame.png'" >> out/diagnostics/list.txt
          done
          ffmpeg -v error -y -f concat -safe 0 -i out/diagnostics/list.txt -vf 'scale=270:480,tile=4x1' -frames:v 1 -q:v 18 out/diagnostics/sheet.jpg
          base64 -w0 out/diagnostics/sheet.jpg | split -b 3500 -d -a 3 - out/diagnostics/chunk-
      - name: Diagnostic image chunks 1
        if: inputs.diagnostics == 'true'
        working-directory: remotion-app
        run: |
          for n in $(seq 0 9); do i=$(printf '%03d' "$n"); f="out/diagnostics/chunk-$i"; [ ! -f "$f" ] || echo "::notice title=sheet-$i::$(cat "$f")"; done
      - name: Diagnostic image chunks 2
        if: inputs.diagnostics == 'true'
        working-directory: remotion-app
        run: |
          for i in $(seq -w 10 19); do f="out/diagnostics/chunk-0$i"; [ ! -f "$f" ] || echo "::notice title=sheet-0$i::$(cat "$f")"; done
      - name: Diagnostic image chunks 3
        if: inputs.diagnostics == 'true'
        working-directory: remotion-app
        run: |
          for i in $(seq -w 20 29); do f="out/diagnostics/chunk-0$i"; [ ! -f "$f" ] || echo "::notice title=sheet-0$i::$(cat "$f")"; done
      - name: Upload diagnostic stills
        if: inputs.diagnostics == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pendulum-keyframes-720p
          path: remotion-app/out/diagnostics/
          retention-days: 7

      - name: Still preview
        if: inputs.diagnostics != 'true'
        working-directory: remotion-app
        run: |
          npx remotion browser ensure
          npx remotion still src/index.ts "${{ github.event.inputs.composition }}" \
            out/still.png --frame="${{ github.event.inputs.still_frame }}" ${{ github.event.inputs.size == '2K' && '--width=1440 --height=2560' || github.event.inputs.size == '1080' && '--scale=1' || '--width=720 --height=1280' }} --timeout=300000 --concurrency=2 --gl=swiftshader --browser-executable="$CHROME_PATH" --log=verbose

      - name: Render video
        if: inputs.diagnostics != 'true'
        working-directory: remotion-app
        run: |
          set -o pipefail
          set +e
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" \
            out/final.mp4 --codec h264 --crf "${{ github.event.inputs.crf }}" ${{ github.event.inputs.size == '2K' && '--width=1440 --height=2560' || github.event.inputs.size == '1080' && '--scale=1' || '--width=720 --height=1280' }} --gl=swiftshader --timeout=300000 --concurrency=2 --browser-executable="$CHROME_PATH" 2>&1 | tee out/render.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the actual failure in the check annotation, even if job logs are unavailable.
            message=$(tail -c 12000 out/render.log | tr '\r' '\n' | tail -n 30)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            echo "::error::Render failed (exit $status): $message"
          fi
          exit "$status"

      - name: Mux voice mix
        if: inputs.diagnostics != 'true' && inputs.mix != ''
        run: |
          ffmpeg -y -i remotion-app/out/final.mp4 -i "${{ github.event.inputs.mix }}" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -shortest remotion-app/out/final-muxed.mp4
          mv remotion-app/out/final-muxed.mp4 remotion-app/out/final.mp4

      - name: Upload MP4
        if: inputs.diagnostics != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-3d-short
          path: |
            remotion-app/out/final.mp4
            remotion-app/out/still.png
          if-no-files-found: error
          retention-days: 14
