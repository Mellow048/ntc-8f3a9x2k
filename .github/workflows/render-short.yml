name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: false
        default: "SupermarketShort"
      mix:
        description: "Voice/mix WAV path in repo"
        required: false
        default: "shoots/supermarket/audio/mix.wav"
      crf:
        description: "x264 CRF (lower is better)"
        required: false
        default: "16"
      size:
        description: "Final size: 720 (720x1280, fastest) or 1080 or 2K (slow on CI CPU)"
        required: false
        default: "720"
      still_frame:
        description: "Frame number(s) for the still preview, comma separated"
        required: false
        default: "100"
      stills_only:
        description: "true = render the stills and stop (build loop, no video)"
        required: false
        default: "false"
      assemble_only:
        description: "true = skip rendering and only join the chunks of an earlier run"
        required: false
        default: "false"
      qa_only:
        description: "true = skip rendering; measure and fix the delivered MP4 and grab QA frames"
        required: false
        default: "false"
      chunks_run:
        description: "Run id holding the chunk-* artifacts (empty = this run)"
        required: false
        default: ""

# The film is rendered in three frame ranges on three runners at once, then joined here. A single
# software-WebGL pass over 3000 frames takes ~3 h on one runner and can hit the job timeout; three
# ~1000-frame chunks finish in about a third of that with identical encoding settings, so the join
# is a stream copy.
jobs:
  render:
    if: inputs.assemble_only != 'true' && inputs.qa_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 0
            frames: "0-1023"
          - part: 1
            frames: "1024-2047"
          - part: 2
            frames: "2048-3069"
    env:
      REMOTION_TMP: ${{ github.workspace }}/.remotion-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json

      - name: Install Playwright Chromium (SwiftShader WebGL)
        run: npx playwright@1.49.1 install --with-deps chromium
        working-directory: remotion-app

      - name: Resolve Playwright Chromium path
        run: |
          CHROME="$(find ~/.cache/ms-playwright -maxdepth 4 -type f -name chrome -o -name headless_shell | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          ls -lh "$CHROME" || true

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install (Remotion scaffold)
        working-directory: remotion-app
        run: npm ci

      - name: Typecheck
        working-directory: remotion-app
        run: npx tsc --noEmit

      - name: Still preview
        if: inputs.stills_only == 'true' && matrix.part == 0
        working-directory: remotion-app
        run: |
          mkdir -p out/stills
          npx remotion browser ensure
          IFS=',' read -ra FS <<< "${{ github.event.inputs.still_frame }}"
          for FR in "${FS[@]}"; do
            FR="$(echo "$FR" | tr -d ' ')"
            echo "--- still, frame $FR"
            npx remotion still src/index.ts "${{ github.event.inputs.composition }}" \
              "out/stills/f$(printf '%05d' "$FR").png" --frame="$FR" --scale=0.5 \
              --timeout=300000 --concurrency=2 --gl=swiftshader --browser-executable="$CHROME_PATH"
          done
          cp out/stills/f*.png out/still.png 2>/dev/null || true

      - name: Render chunk
        if: inputs.stills_only != 'true'
        working-directory: remotion-app
        run: |
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" \
            out/part.mp4 --codec h264 --crf "${{ github.event.inputs.crf }}" \
            ${{ github.event.inputs.size == '2K' && '--width=1440 --height=2560' || github.event.inputs.size == '1080' && '--scale=1' || '--width=720 --height=1280' }} \
            --frames="${{ matrix.frames }}" --gl=swiftshader --timeout=300000 --concurrency=2 \
            --browser-executable="$CHROME_PATH"

      - name: Upload chunk
        if: inputs.stills_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.part }}
          path: remotion-app/out/part.mp4
          if-no-files-found: error
          retention-days: 7

      # Artifacts live on blob storage, which the build environment cannot reach; in stills-only mode the
      # stills are also committed to the branch so the frames can be reviewed straight from the repo.
      - name: Archive stills to the branch
        if: inputs.stills_only == 'true' && matrix.part == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shoots/pig-war/stills
          rm -f shoots/pig-war/stills/*.png
          cp remotion-app/out/stills/*.png shoots/pig-war/stills/
          git config user.name "Arena CI"
          git config user.email "ci@arena.ai"
          git add -A shoots/pig-war/stills
          git commit -m "CI: stills from run ${{ github.run_id }}" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME" || true
            git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "stills pushed"; exit 0; fi
            sleep 5
          done
          echo "could not push stills"; exit 1

      - name: Upload stills
        if: inputs.stills_only == 'true' && matrix.part == 0
        uses: actions/upload-artifact@v4
        with:
          name: stills
          path: remotion-app/out/stills
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: render
    if: always() && inputs.stills_only != 'true' && inputs.qa_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Fetch chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          run-id: ${{ inputs.chunks_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Join chunks and mux the mix
        run: |
          set -x
          ls -lhR chunks | head -40
          : > list.txt
          for d in $(ls -d chunks/chunk-* | sort -V); do
            f="$(find "$d" -name '*.mp4' | head -1)"
            echo "file '$PWD/$f'" >> list.txt
          done
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy video.mp4
          if [ ! -s video.mp4 ]; then
            echo "stream copy failed; re-encoding the join"
            ffmpeg -y -f concat -safe 0 -i list.txt -c:v libx264 -crf 16 -pix_fmt yuv420p -r 30 video.mp4
          fi
          if [ -n "${{ inputs.mix }}" ]; then
            ffmpeg -y -i video.mp4 -i "${{ inputs.mix }}" \
              -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -ar 48000 -shortest final.mp4
          else
            cp video.mp4 final.mp4
          fi
          ffprobe -v error -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,nb_frames,sample_rate,channels \
            -of default=nw=1 final.mp4

      - name: Publish MP4 to the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shoots/pig-war
          cp final.mp4 shoots/pig-war/PIG_WAR.mp4
          git config user.name "Arena CI"
          git config user.email "ci@arena.ai"
          git add -f shoots/pig-war/PIG_WAR.mp4
          git commit -m "Render: pig-war short (run ${{ inputs.chunks_run || github.run_id }})" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME" || true
            git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "mp4 pushed"; exit 0; fi
            sleep 5
          done
          echo "could not push mp4"; exit 1

      # whatever happened, put the evidence where the build can read it (logs are unreachable from here)
      - name: Keep the join log
        if: always()
        run: |
          mkdir -p shoots/pig-war/qa
          {
            echo "# join log — chunks from run ${{ inputs.chunks_run || github.run_id }}"
            echo
            echo '```'
            ls -lR chunks 2>&1 | head -40
            cat list.txt 2>&1
            [ -f video.mp4 ] && ffprobe -v error -show_entries format=duration -of default=nw=1 video.mp4 2>&1
            [ -f final.mp4 ] && ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate,sample_rate,channels -of default=nw=1 final.mp4 2>&1
            echo '```'
          } > shoots/pig-war/qa/join.md
          git add -A shoots/pig-war/qa/join.md
          git commit -m "QA: join log for run ${{ inputs.chunks_run || github.run_id }}" || true
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pig-war-final
          path: final.mp4
          if-no-files-found: warn
          retention-days: 14

  qa:
    if: inputs.qa_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      # The mix was built by RMS, not by the loudness meter. Measure the delivered file and, if it is
      # off the -15 LUFS gate, re-mux the same video stream with the gain and a limiter. No re-render.
      - name: Level the delivery and grab QA frames
        run: |
          set -e
          V=shoots/pig-war/PIG_WAR.mp4
          O=shoots/pig-war/qa
          mkdir -p "$O"; rm -f "$O"/*.jpg "$O"/QC.md

          ffprobe -v error -show_entries format=duration,size,bit_rate             -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,nb_frames,sample_rate,channels             -of default=nw=1 "$V" > /tmp/probe.txt 2>&1

          ffmpeg -hide_banner -nostats -i "$V" -af ebur128=peak=true -f null - 2> /tmp/loud0.txt || true
          I=$(grep -A6 "Integrated loudness" /tmp/loud0.txt | grep " I:" | tail -1 | sed 's/.*I: *//; s/ *LUFS//')
          TP=$(grep -A2 "True peak" /tmp/loud0.txt | grep "Peak:" | tail -1 | sed 's/.*Peak: *//; s/ *dBFS//')
          echo "measured I=$I LUFS  TP=$TP dBTP"
          GAIN=$(python3 - "$I" <<'EOF'
          import sys
          try: i = float(sys.argv[1])
          except Exception: i = -20.0
          g = -15.0 - i
          print(f"{max(-24.0, min(24.0, g)):.2f}")
          EOF
          )
          echo "applying $GAIN dB"
          ffmpeg -y -v error -i "$V" -c:v copy -af "volume=${GAIN}dB,alimiter=limit=0.85:level=disabled" \
            -c:a aac -b:a 192k -ar 48000 -movflags +faststart "/tmp/leveled.mp4"
          ffprobe -v error -show_entries format=duration -of default=nw=1 "/tmp/leveled.mp4" | grep -q "duration" \
            && mv /tmp/leveled.mp4 "$V"

          ffmpeg -hide_banner -nostats -i "$V" -af ebur128=peak=true -f null - 2> /tmp/loud1.txt || true
          I2=$(grep -A6 "Integrated loudness" /tmp/loud1.txt | grep " I:" | tail -1 | sed 's/.*I: *//; s/ *LUFS//')
          TP2=$(grep -A2 "True peak" /tmp/loud1.txt | grep "Peak:" | tail -1 | sed 's/.*Peak: *//; s/ *dBFS//')

          {
            echo "# Pig War — QA of the delivered file"
            echo
            echo "\`shoots/pig-war/PIG_WAR.mp4\`"
            echo
            echo '```'
            cat /tmp/probe.txt
            echo '```'
            echo
            echo "| measure | before | after |"
            echo "|---|---|---|"
            echo "| integrated loudness (LUFS) | $I | $I2 |"
            echo "| true peak (dBTP) | $TP | $TP2 |"
            echo "| gain applied (dB) | | $GAIN |"
            echo
            echo "## frames"
            echo
          } > "$O/QC.md"

          for T in 2 9 16 24 30 38 46 52 58 64 71 76 82 88 92 97 101; do
            ffmpeg -y -v error -ss "$T" -i "$V" -frames:v 1 -q:v 3 "$O/t$(printf '%03d' "$T").jpg"
            echo "- ${T}s → \`t$(printf '%03d' "$T").jpg\`" >> "$O/QC.md"
          done
          sed -n '1,40p' "$O/QC.md"

      - name: Commit QA and the leveled MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Arena CI"
          git config user.email "ci@arena.ai"
          git add -f shoots/pig-war/PIG_WAR.mp4 shoots/pig-war/qa
          git commit -m "QA: measure, level and sample the delivered file" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME" || true
            git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "qa pushed"; exit 0; fi
            sleep 5
          done
          echo "could not push qa"; exit 1
