name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: false
        default: "SupermarketShort"
      mix:
        description: "Voice/mix WAV path in repo"
        required: false
        default: "shoots/supermarket/audio/mix.wav"
      crf:
        description: "x264 CRF (lower is better)"
        required: false
        default: "16"
      size:
        description: "Final size: 720 (720x1280, fastest) or 1080 or 2K (slow on CI CPU)"
        required: false
        default: "720"
      still_frame:
        description: "Frame number for the still preview"
        required: false
        default: "100"
      publish_run_id:
        description: "If set, skip the render and attach this run's cartoon-3d-short artifact to a GitHub release"
        required: false
        default: ""
      release_tag:
        description: "Release tag for publish mode"
        required: false
        default: "darkday-v1"
      asset_name:
        description: "File name of the MP4 asset in the release"
        required: false
        default: "DarkDay-1780-720p.mp4"

jobs:
  render:
    if: github.event.inputs.publish_run_id == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 300
    env:
      REMOTION_TMP: ${{ github.workspace }}/.remotion-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-app/package-lock.json

      - name: Install Playwright Chromium (SwiftShader WebGL)
        run: npx playwright@1.49.1 install --with-deps chromium
        working-directory: remotion-app

      - name: Resolve Playwright Chromium path
        run: |
          CHROME="$(find ~/.cache/ms-playwright -maxdepth 4 -type f -name chrome -o -name headless_shell | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          ls -lh "$CHROME" || true

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install (Remotion scaffold)
        working-directory: remotion-app
        run: npm ci

      - name: Typecheck
        working-directory: remotion-app
        run: npx tsc --noEmit

      - name: Still preview
        working-directory: remotion-app
        run: |
          npx remotion browser ensure
          npx remotion still src/index.ts "${{ github.event.inputs.composition }}" \
            out/still.png --frame="${{ github.event.inputs.still_frame }}" --scale=1 --timeout=300000 --concurrency=2 --gl=swiftshader --browser-executable="$CHROME_PATH" --log=verbose

      - name: Render video
        working-directory: remotion-app
        run: |
          set -o pipefail
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" \
            out/final.mp4 --codec h264 --crf "${{ github.event.inputs.crf }}" ${{ github.event.inputs.size == '2K' && '--width=1440 --height=2560' || github.event.inputs.size == '1080' && '--scale=1' || '--width=720 --height=1280' }} --gl=swiftshader --timeout=300000 --concurrency=2 --browser-executable="$CHROME_PATH" --log=verbose 2>&1 | tee out/render.log

      # Diagnostics on failure: push the tail of render.log to a throwaway diag/<run_id> branch so it can be inspected (artifacts are not reachable from all clients)
      - name: Capture failure log
        if: failure()
        working-directory: remotion-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/diag && mkdir -p /tmp/diag
          tail -c 300000 out/render.log > /tmp/diag/render.log 2>/dev/null || true
          cd /tmp/diag && git init -q . && git config user.email ci-diag@local && git config user.name ci-diag
          git add -A && git commit -qm "render log run ${{ github.run_id }} (size=${{ github.event.inputs.size }})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/diag/${{ github.run_id }} || true

      - name: Mux voice mix
        if: inputs.mix != ''
        run: |
          ffmpeg -y -i remotion-app/out/final.mp4 -i "${{ github.event.inputs.mix }}" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -shortest remotion-app/out/final-muxed.mp4
          mv remotion-app/out/final-muxed.mp4 remotion-app/out/final.mp4

      # QA pass on the muxed master: report.md (specs, loudness, per-frame stats, per-shot stats) is pushed to diag/qa-<run_id> so it can be inspected (artifacts are not reachable from all clients)
      - name: QA report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMP=$(echo "${{ github.event.inputs.composition }}" | tr 'A-Z' 'a-z' | sed 's/short$//')
          python3 -m pip install --quiet --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy || true
          python3 templates/scripts/short_qa.py remotion-app/out/final.mp4 /tmp/qa-out "shoots/${COMP}/qa_shots.json" || echo "QA failed (non-fatal)"
          rm -rf /tmp/qab && mkdir -p /tmp/qab
          cp /tmp/qa-out/report.md /tmp/qa-out/perframe.npz /tmp/qab/ 2>/dev/null || true
          cp remotion-app/out/still.png /tmp/qab/still.png 2>/dev/null || true
          cd /tmp/qab && git init -q . && git config user.email ci-diag@local && git config user.name ci-diag
          git add -A && git commit -qm "qa report ${COMP} run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/diag/qa-${{ github.run_id }}

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-3d-short
          path: |
            remotion-app/out/final.mp4
            remotion-app/out/still.png
          if-no-files-found: error
          retention-days: 14
  # Attach a previous run's artifact to a release: direct, no-login asset links.
  # (dispatch is possible because this workflow is registered on the default branch.)
  publish:
    if: github.event.inputs.publish_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (sanity check)
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Download artifact from the render run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifact && mkdir artifact
          gh run download ${{ github.event.inputs.publish_run_id }} --repo "${{ github.repository }}" --name cartoon-3d-short --dir artifact
          ls -laR artifact
          test -f artifact/final.mp4
          BYTES=$(stat -c%s artifact/final.mp4)
          echo "final.mp4: ${BYTES} bytes"
          [ "$BYTES" -gt 10000000 ] || (echo "artifact suspiciously small" && exit 1)
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of default=noprint_wrappers=1 artifact/final.mp4

      - name: Create release (if missing) and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.event.inputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.event.inputs.release_tag }}" --repo "${{ github.repository }}"               --target arena/5a7dfc84-ntc-8f3a9x2k --title "The Dark Day (1780) — 720p short"               --notes "Burned-in English captions (user order). Voice-09. I=-15.2 LUFS / peak -1.1 dBTP. QA: no black/white frames, no frozen spans (shoots/darkday/DELIVERY.md)."
          fi
          cp artifact/final.mp4 "${{ github.event.inputs.asset_name }}"
          gh release upload "${{ github.event.inputs.release_tag }}" "${{ github.event.inputs.asset_name }}" --repo "${{ github.repository }}" --clobber
          if [ -f artifact/still.png ]; then
            gh release upload "${{ github.event.inputs.release_tag }}" artifact/still.png#darkday-still-1535.png --repo "${{ github.repository }}" --clobber
          fi
          echo "DIRECT_LINK=https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag }}/${{ github.event.inputs.asset_name }}"
