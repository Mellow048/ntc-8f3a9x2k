<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle — SVG study</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #171219;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .frame {
    width: min(100%, 1320px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.85), 0 2px 0 rgba(255,255,255,.06) inset;
    line-height: 0;
  }
  svg { display: block; width: 100%; height: auto; }

  /* looping life that does not need the pedal rig */
  .sway-slow  { animation: swaySlow 19s ease-in-out infinite; }
  .sway-slower{ animation: swaySlow 27s ease-in-out infinite reverse; }
  .gull       { animation: gullBob 7.5s ease-in-out infinite; }
  .spark      { animation: sparkle 3.6s ease-in-out infinite; }
  .scarf-a    { animation: scarfA 1.35s ease-in-out infinite; transform-box: view-box; transform-origin: 650px 196px; }
  .scarf-b    { animation: scarfB 1.7s ease-in-out infinite;   transform-box: view-box; transform-origin: 650px 220px; }
  .pouch      { animation: pouchJiggle 1.05s ease-in-out infinite; transform-box: view-box; transform-origin: 766px 130px; }
  .fish       { animation: fishWag .85s ease-in-out infinite;  transform-box: view-box; transform-origin: 870px 206px; }
  .dust-a     { animation: dust 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .dust-b     { animation: dust 2.6s ease-out infinite .55s; transform-box: fill-box; transform-origin: center; }
  .dust-c     { animation: dust 2.6s ease-out infinite 1.1s; transform-box: fill-box; transform-origin: center; }
  .head       { animation: headBob 3.4s ease-in-out infinite; transform-box: view-box; transform-origin: 700px 150px; }

  @keyframes swaySlow { 0%,100% { transform: translateX(0); } 50% { transform: translateX(16px); } }
  @keyframes gullBob  { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(-1.5deg); } }
  @keyframes sparkle  { 0%,100% { opacity: .18; } 50% { opacity: .85; } }
  @keyframes scarfA   { 0%,100% { transform: rotate(0deg) skewX(0deg); } 50% { transform: rotate(-5deg) skewX(3deg); } }
  @keyframes scarfB   { 0%,100% { transform: rotate(1deg) skewX(0deg); } 50% { transform: rotate(5deg) skewX(-4deg); } }
  @keyframes pouchJiggle { 0%,100% { transform: scale(1,1) translateY(0); } 45% { transform: scale(1.016,1.028) translateY(1.4px); } }
  @keyframes fishWag  { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
  @keyframes dust     { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 18% { opacity: .5; } 100% { opacity: 0; transform: translate(-74px,-24px) scale(1.4); } }
  @keyframes headBob  { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2.2px) rotate(-.7deg); } }

  body.paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const BB = { x: 608, y: 582 };
  const CRANK = 60;
  const HIP = { x: 525, y: 330 };
  const THIGH = 175, SHIN = 155;
  const HUB_R = { x: 365, y: 564 };
  const HUB_F = { x: 858, y: 564 };
  const GEAR = 2.35;

  const wheelRear = $('wheelRear'), wheelFront = $('wheelFront');
  const crankNear = $('crankNear'), crankFar = $('crankFar');
  const bird = $('bird');
  const legNear = { thighO: $('nearThighOutline'), thigh: $('nearThigh'),
                    shinO: $('nearShinOutline'), shin: $('nearShin'), foot: $('footNear'), cuff: $('cuffNear') };
  const legFar  = { thighO: $('farThighOutline'), thigh: $('farThigh'),
                    shinO: $('farShinOutline'), shin: $('farShin'), foot: $('footFar') };


  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // pose the inner placement group, so the baked static frame is never doubled up
  const setXf = (el, v) => (el.firstElementChild || el).setAttribute('transform', v);

  function kneeFor(hip, ankle) {
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const d = clamp(Math.hypot(dx, dy), Math.abs(THIGH - SHIN) + 1, THIGH + SHIN - 1);
    const base = Math.atan2(dy, dx);
    const cosA = clamp((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d), -1, 1);
    const a = Math.acos(cosA);
    const k1 = { x: hip.x + THIGH * Math.cos(base - a), y: hip.y + THIGH * Math.sin(base - a) };
    const k2 = { x: hip.x + THIGH * Math.cos(base + a), y: hip.y + THIGH * Math.sin(base + a) };
    return k1.x > k2.x ? k1 : k2;
  }

  function drawLeg(leg, hip, pedal, knee) {
    leg.thighO.setAttribute('d', `M${hip.x} ${hip.y}L${knee.x} ${knee.y}`);
    leg.thigh.setAttribute('d',  `M${hip.x} ${hip.y}L${knee.x} ${knee.y}`);
    leg.shinO.setAttribute('d', `M${knee.x} ${knee.y}L${pedal.x} ${pedal.y - 5}`);
    leg.shin.setAttribute('d',  `M${knee.x} ${knee.y}L${pedal.x} ${pedal.y - 5}`);
    setXf(leg.foot, `translate(${pedal.x + 4} ${pedal.y - 13}) rotate(-2)`);
    if (leg.cuff) setXf(leg.cuff, `translate(${knee.x} ${knee.y})`);
  }

  function pose(angle) {
    const deg = angle * 180 / Math.PI;
    wheelRear.setAttribute('transform', `rotate(${deg * GEAR} ${HUB_R.x} ${HUB_R.y})`);
    wheelFront.setAttribute('transform', `rotate(${deg * GEAR} ${HUB_F.x} ${HUB_F.y})`);

    crankNear.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${deg})`);
    crankFar.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${deg + 180})`);
    crankNear.querySelector('g').setAttribute('transform', `translate(60 0) rotate(${-deg})`);
    crankFar.querySelector('g').setAttribute('transform', `translate(60 0) rotate(${-(deg + 180)})`);

    const bobY = Math.sin(angle * 2) * 2.4;
    const sway = Math.sin(angle * 2 + 0.6) * 0.5;
    bird.setAttribute('transform', `translate(0 ${bobY.toFixed(2)}) rotate(${sway.toFixed(2)} 505 352)`);

    const nearPedal = { x: BB.x + CRANK * Math.cos(angle), y: BB.y + CRANK * Math.sin(angle) };
    const farPedal  = { x: BB.x - CRANK * Math.cos(angle), y: BB.y - CRANK * Math.sin(angle) };
    const hipNear = { x: HIP.x, y: HIP.y + bobY };
    const hipFar  = { x: HIP.x - 9, y: HIP.y + bobY };

    drawLeg(legNear, hipNear, nearPedal, kneeFor(hipNear, nearPedal));
    drawLeg(legFar,  hipFar,  farPedal,  kneeFor(hipFar, farPedal));
  }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let running = !reduced;
  let angle = -0.62;
  let t0 = null;

  function tick(now) {
    if (t0 === null) t0 = now;
    const dt = Math.min(0.05, (now - t0) / 1000);
    t0 = now;
    if (running) angle += dt * 4.4;
    pose(angle);
    requestAnimationFrame(tick);
  }

  pose(angle);
  if (!reduced) requestAnimationFrame(tick);

  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); running = !running; document.body.classList.toggle('paused', !running); }
  });
  document.getElementById('art').addEventListener('click', () => {
    running = !running; document.body.classList.toggle('paused', !running);
  });
})();
</script>
